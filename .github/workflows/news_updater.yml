name: Auto Update News & Push Alerts

on:
  schedule:
    # Runs automatically every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Allows you to manually trigger anytime via the GitHub Actions button

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hera News Engine & Push Notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python update_news.py

      - name: Commit and Push Updated news.json and State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json .news_engine_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Hera breaking news & feed [skip ci]" && git push)
